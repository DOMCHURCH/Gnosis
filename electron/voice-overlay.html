<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Gnosis voice</title>
    <style>
      /* Two states in one window.
       *
       * COLLAPSED is a slim pill that sits over whatever the user is doing and
       * says as little as possible: a pulse, a state word, a live waveform, and a
       * shield that badges when something needs an answer.
       *
       * EXPANDED grows sideways into a panel with the conversation on the left and
       * a tabbed tray on the right. It opens on a click, and by itself the moment a
       * permission request arrives — a request that stayed hidden behind a pill
       * would be a session that silently stops making progress.
       *
       * The window resizes to match; the page just tells the main process which
       * state it is in. One blur and one gradient rim in both, because this floats
       * above real work and must not cost frames.
       */
      :root {
        --cyan: #22d3ee;
        --violet: #8b7cf6;
        --magenta: #e879f9;
        --text: #e6e9f0;
        /* Raised from #8b93a3 / #5c6373. Those were picked against the old
         * near-opaque dark panel; over a translucent surface whose backdrop can
         * be anything, the dimmer of the two fell well under WCAG AA for body
         * text — the footer note was legibly there and practically unreadable.
         * These clear 4.5:1 against the darkest the scrim guarantees. */
        --dim: #cdd4de;
        --dimmer: #b9c1cd;
        --line: rgba(255, 255, 255, 0.14);
        --ease: 220ms cubic-bezier(0.22, 1, 0.36, 1);
        /* Collapsed is a pill: the radius is half the height, whatever the
         * height turns out to be. Hard-coding 999px worked only because the
         * window happened to be 92px tall — see the responsive note below. */
        --radius: 999px;
        /* Transparent room around the pill for its drop shadow. Kept in sync
         * with SHADOW_PAD in voice.js — see the note on body's padding. */
        --shadow-pad: 24px;
      }
      /*
       * The window is BIGGER than the pill, and this padding is the difference.
       *
       * .frame casts a 32px and a 48px drop shadow. A shadow is painted outside
       * its element, and the window used to be sized to exactly the pill — so
       * there was nowhere for it to go and Chromium clipped it at the window
       * rectangle. What should have been a soft halo came out as a hard-edged
       * dark box around the pill, which is what it looked like: a rounded pill
       * sitting inside a square. On a 250%-scaled display the blurs render at 80
       * and 120 device pixels, so essentially all of the shadow was clipped.
       *
       * boundsFor() in voice.js adds the same number to the window on every
       * side. The two have to agree: padding here without the room there just
       * shrinks the pill, and room there without padding here re-opens the gap.
       */
      html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
      body { padding: var(--shadow-pad); box-sizing: border-box; }
      body {
        font: 12px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        -webkit-app-region: drag;
        user-select: none;
      }
      /*
       * The whole body is a drag region, so anything you are meant to CLICK has
       * to opt out explicitly. `button` covers the controls, but the containers
       * around them are listed too: on Windows the drag region is hit-tested by
       * the OS against a rectangle list Chromium hands it, and a no-drag child
       * inside a drag parent is reliable only when the parent is not also
       * establishing its own stacking/compositing context over it. Marking the
       * wrapper as well removes that dependency entirely.
       */
      button, .card, .tab, #transcript, #response, a,
      #collapsed, #expanded, .pillActions, .tabs, .acts, .pane {
        -webkit-app-region: no-drag;
      }
      /* The pill still has to be draggable somewhere, or the panel cannot be
       * moved at all. The text block is that handle — it is the one area with no
       * controls in it. */
      .pillText, .orb, #pillWave { -webkit-app-region: drag; }
      button { font: inherit; color: inherit; cursor: pointer; }

      /*
       * FROSTED GLASS — the standard recipe, not a heavy blur.
       *
       * Two things were making this read as a grey blob rather than glass.
       *
       * 1. The blur was far too strong (38px). Past roughly 20px every backdrop
       *    averages out to its own mean colour, and the mean of anything is
       *    grey. Glass reads as glass because you can still make out WHAT is
       *    behind it — shapes, edges, colour — just softened. 16px keeps that;
       *    38px destroys the very information the effect is made of, and no
       *    amount of saturate() puts back detail that has already been averaged
       *    away.
       * 2. The fill was 5.5% white and the shadow was pure black. A near-zero
       *    fill leaves nothing to catch light, and a black shadow drains colour
       *    from everything it touches. The fill is now 10% and the shadow is
       *    BLUE (rgba(31,38,135,.37)) — a coloured shadow is what makes the
       *    surface look lifted off the page instead of stamped into it.
       *
       * The animated SVG feDisplacementMap that used to be chained onto
       * backdrop-filter is gone. It re-evaluated a turbulence filter over the
       * whole backdrop every frame, on a window that floats permanently above
       * real work — the compositor cost was real and the payoff was a warp
       * nobody could see through a 38px blur anyway. Smooth beats clever here.
       *
       * Three layers, each doing one job:
       *   .frame  — the rim. A bright highlight along the TOP edge only, fading
       *             out by the bottom: light from above catching a curved edge,
       *             not a gradient wrapping the whole shape.
       *   .glass  — the body. Blur + saturate + a low-opacity white fill, so
       *             what is behind reads as vivid-through-frost, not washed out.
       *   ::before — the specular highlight. The contrast scrim is folded into
       *             .glass's own background rather than a ::after, for
       *             hit-testing reasons explained there.
       */
      .frame {
        height: 100%;
        box-sizing: border-box;
        padding: 1px;
        border-radius: var(--radius);
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.75) 0%,
          rgba(255, 255, 255, 0.22) 14%,
          rgba(255, 255, 255, 0.05) 32%,
          rgba(255, 255, 255, 0.02) 55%,
          rgba(255, 255, 255, 0.14) 100%);
        /* The coloured lift, then a short contact shadow to seat it. */
        box-shadow:
          0 8px 32px 0 rgba(31, 38, 135, 0.37),
          0 16px 48px -12px rgba(10, 12, 30, 0.55),
          0 2px 6px -2px rgba(0, 0, 0, 0.4);
        transition: border-radius var(--ease);
      }
      .glass {
        height: 100%;
        box-sizing: border-box;
        border-radius: var(--radius);
        /* Two layers in ONE background, and that matters structurally.
         *
         * The dark scrim used to be a ::after pseudo-element. A pseudo-element
         * is painted after in-flow children, so the content needed `z-index: 1`
         * to sit above it — and that z-index established a stacking context
         * around every button in the panel. On Windows a `-webkit-app-region:
         * no-drag` child inside a `drag` parent is hit-tested against a
         * rectangle list the compositor hands the OS, and an extra stacking
         * context in between is exactly the kind of thing that makes those
         * rectangles come out wrong: the buttons rendered, and clicks went to
         * the drag region instead.
         *
         * An element's own background paints BELOW its children by definition,
         * so putting the scrim here needs no z-index, no pseudo-element, and no
         * stacking context. Same pixels, no hit-testing hazard.
         *
         * Order is top-down: the scrim gradient first, the white fill under it.
         */
        /*
         * Darker than it was (0.45 -> 0.78). brightness(0.45) used to clamp
         * whatever was behind the panel before anything composited over it, so
         * the scrim only had to finish the job; without it this is the entire
         * contrast guarantee, and light text over a white document underneath
         * has to stay readable. s90 computes the resulting ratios against a
         * white desktop rather than trusting this note: 8.52, 6.94 and 5.71 to
         * one for the three text colours, against 4.5 for AA.
         */
        background:
          linear-gradient(rgba(8, 10, 18, 0.78), rgba(8, 10, 18, 0.78)),
          rgba(255, 255, 255, 0.10);
        /* The 1px inner edge — light catching the lip of the glass from inside.
         * inset, so it survives the .frame gradient sitting outside it. */
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.20);
        /*
         * brightness(0.45) is the contrast guarantee, and it is why the text
         * colours below can stay honestly dim.
         *
         * This panel floats over whatever the user has on screen, which can be a
         * white document — and light text on frosted white is unreadable no
         * matter how the fill is tuned. brightness() clamps the backdrop BEFORE
         * anything is composited over it, so a white desktop arrives as mid-grey
         * while a dark or colourful one keeps its hue and detail (brightness
         * scales channels, it does not wash them toward grey the way a heavier
         * opaque scrim would). With the scrim below it, every text colour in
         * here clears WCAG AA against a pure-white backdrop — the worst case —
         * which is checked numerically rather than guessed at.
         */
        /*
         * No backdrop-filter here, and it is not a style choice.
         *
         * An element with backdrop-filter needs a backdrop to sample. In a
         * TRANSPARENT window there is nothing behind it — the desktop belongs to
         * the compositor, not to this page — so Chromium gives the window an
         * opaque backing to filter instead, and the whole window turns black
         * wherever the page has not painted something over it. That is the dark
         * rectangle around the pill: not a clipped shadow, which would be soft
         * and graduated, but the window's own background showing through the
         * rounded corners and the shadow margin.
         *
         * It was never doing the job it was written for either: it could only
         * ever have blurred content inside this same window, and there is none
         * behind the glass. The scrim below does the contrast work it was
         * credited with, which is why the text colours are unchanged.
         */
        overflow: hidden;
        position: relative;
        transition: border-radius var(--ease);
      }
      /* The specular highlight — top-left, aligned with the rim light above it,
       * because a highlight that does not agree with its own rim light reads as
       * two light sources. Static: a highlight that moves on its own, with
       * nothing moving the glass, reads as a shimmer effect, not a material. */
      .glass::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(140px 70px at 18% -20%, rgba(255, 255, 255, 0.30), transparent 70%);
        mix-blend-mode: screen;
      }
      /* No z-index here on purpose — see the note on .glass's background. The
       * only remaining pseudo-layer is ::before (the specular highlight), which
       * is painted BEFORE in-flow children and so is already underneath them. */
      body.expanded { --radius: 22px; }

      /* ------------------------------------------------------------ collapsed
       *
       * The right-hand padding is not cosmetic. The pill's right end is a
       * semicircular cap of radius h/2, so a round control parked near it is
       * clipped by the curve long before its bounding box leaves the element —
       * the shield read as fused to the edge (VOICE-UI-ISSUES.md #2) because
       * 10px of padding is only 10px at the exact vertical centre and less
       * everywhere else, and the notification badge (which overhangs the shield
       * by 2px on two sides) came within a couple of pixels of the rim.
       *
       * The controls now sit in their own group inset far enough that the badge
       * corner clears the cap with room to spare, and the gap is what separates
       * them from the waveform rather than the window edge doing it.
       */
      #collapsed { height: 100%; display: flex; align-items: center; gap: 14px; padding: 0 20px 0 18px; box-sizing: border-box; }
      body.expanded #collapsed { display: none; }
      /* The shield and × travel together, so one gap governs the pair and
       * neither can drift into the curve on its own. */
      .pillActions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

      .orb { position: relative; width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; }
      /*
       * An arc, not a full ring. A closed circle around a pulsing dot reads as a
       * target; an open one reads as something in progress, which is what the
       * pill is actually saying. Two of the four borders are coloured and the
       * other two are transparent, so the gap is part of the shape rather than
       * something drawn over it.
       */
      .orb .ring {
        position: absolute; inset: 0; border-radius: 50%;
        border: 1.5px solid transparent;
        border-top-color: var(--cyan);
        border-left-color: rgba(80, 200, 255, 0.55);
        animation: spin 3.4s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) { .orb .ring { animation: none; } }
      .orb .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
        animation: pulse 1.9s ease-out infinite;
      }
      @keyframes pulse {
        0% { transform: scale(0.85); opacity: 0.75; }
        50% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(0.85); opacity: 0.75; }
      }
      @media (prefers-reduced-motion: reduce) { .orb .dot { animation: none; } }

      /*
       * `flex: 0 0 auto` here meant the label refused to give up a single pixel,
       * so on a narrow pill it was the waveform that collapsed to nothing and
       * then the CONTROLS that got pushed out past the rounded edge and clipped
       * by overflow:hidden — the × simply was not there any more. Priority now
       * runs: controls (never shrink) > label (shrinks, ellipsises) > waveform
       * (goes first, and is the one thing nobody needs to operate the panel).
       */
      .pillText { flex: 1 1 auto; min-width: 0; overflow: hidden; }
      #pillState { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #pillHint { font-size: 10.5px; color: var(--dimmer); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      /* Narrow enough that the hint is a row of dots: drop it rather than render
       * a sentence nobody can read. (The waveform is already gone at every
       * width — see above.) */
      @media (max-width: 380px) {
        #pillHint { display: none; }
      }
      /*
       * The pill has no waveform.
       *
       * It shared the row with the label on equal terms (both flex: 1 1 auto),
       * so it took about half the space the text needed — and the text is the
       * part with something to say. What actually reached the screen was a hint
       * ending in "Voice off in ..." next to a four-pixel stub of waveform: two
       * things too small to be either of them.
       *
       * The level meter lives in the expanded panel, at a size where you can
       * read syllables off it. Kept in the markup, not deleted, because the
       * drawing code addresses both canvases by id and a missing element is a
       * null check in a rAF loop.
       */
      #pillWave { display: none; }

      .shield, .closeBtn {
        position: relative; flex: 0 0 auto;
        width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06);
        display: grid; place-items: center;
        transition: background-color var(--ease), border-color var(--ease);
      }
      .shield:hover { background: rgba(139, 124, 246, 0.20); border-color: rgba(139, 124, 246, 0.55); }
      .shield svg, .closeBtn svg { width: 15px; height: 15px; stroke: var(--dim); fill: none; stroke-width: 1.6; }
      /* The × is a stop button, so it warms to red rather than to the accent —
       * it turns the feature off, which is not the same kind of action as
       * opening a panel. */
      .closeBtn:hover { background: rgba(248, 113, 113, 0.20); border-color: rgba(248, 113, 113, 0.55); }
      .closeBtn:hover svg { stroke: #fca5a5; }
      .badge {
        position: absolute; top: -2px; right: -2px; min-width: 17px; height: 17px; padding: 0 4px;
        border-radius: 999px; background: linear-gradient(135deg, var(--violet), var(--magenta));
        color: #fff; font-size: 10px; font-weight: 700; display: none; place-items: center;
        box-sizing: border-box; line-height: 17px; text-align: center;
      }
      body.haspending .badge { display: block; }
      body.haspending .shield { border-color: rgba(232, 121, 249, 0.6); background: rgba(232, 121, 249, 0.12); }

      /* ------------------------------------------------------------- expanded */
      #expanded { display: none; height: 100%; box-sizing: border-box; }
      body.expanded #expanded { display: flex; }

      /*
       * The conversation column. `flex: 0 0 300px` was the single worst
       * fixed-pixel assumption in here (VOICE-UI-ISSUES.md #3): at any width
       * below ~620px it refused to give up a pixel, so the tab strip and the
       * permission cards were squeezed to nothing while this column sat at its
       * full size. It now has a preferred width it will shrink from, and a floor
       * it will not go under.
       */
      .left {
        flex: 1 1 300px; max-width: 340px; min-width: 190px;
        padding: 20px; box-sizing: border-box;
        display: flex; flex-direction: column; min-height: 0;
        border-right: 1px solid var(--line);
      }
      /* Below this the two-column split stops being a split — the right pane
       * would be narrower than a single permission card's buttons. Stack it, and
       * let the conversation column keep the top. */
      @media (max-width: 560px) {
        #expanded { flex-direction: column; }
        /* `flex: 0 0 auto` here pushed .right — and with it the × pinned to its
         * corner — clean off the bottom of a short panel. The conversation
         * column gives way first; the controls are what must stay reachable. */
        .left {
          flex: 0 1 auto; min-height: 0; max-width: none; overflow: hidden;
          border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 16px;
        }
        .right { flex: 1 1 auto; min-height: 0; padding: 12px 16px 14px; }
        .bigOrb { display: none; } /* the collapsed pill's orb already said this */
      }
      /* A short window (a small display, or a scaled one) has no room for the
       * orb and the step rail on top of the actual conversation. */
      @media (max-height: 260px) {
        .bigOrb { display: none; }
        .steps { display: none; }
      }
      .bigOrb { position: relative; width: 74px; height: 74px; flex: 0 0 auto; display: grid; place-items: center; margin-bottom: 14px; }
      .bigOrb .arc { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--cyan); border-left-color: var(--violet); animation: spin 3.4s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .bigOrb .arc { animation: none; } }
      .bigOrb .core { width: 12px; height: 12px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }

      #bigState { font-size: 19px; font-weight: 500; margin-bottom: 8px; }
      #bigWave { width: 100%; height: 26px; display: block; margin-bottom: 12px; }
      #transcript { font-size: 12.5px; color: var(--text); margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      #response { font-size: 11.5px; color: var(--dim); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
      .spacer { flex: 1 1 auto; min-height: 8px; }

      /*
       * Three states, one of which is true. The live one is a filled chip and
       * the others are bare, so which one you are in is readable at a glance
       * from across a desk — a rail of three identically-weighted labels with
       * one slightly brighter is not.
       */
      .steps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 9.5px; letter-spacing: 0.1em; color: var(--dimmer); }
      .step {
        display: flex; align-items: center; gap: 7px;
        padding: 6px 12px; border-radius: 999px;
        border: 1px solid transparent;
        transition: background-color var(--ease), border-color var(--ease), color var(--ease);
      }
      .step .bullet { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--dimmer); flex: 0 0 auto; }
      .step.on {
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(255, 255, 255, 0.16);
      }
      .step.on .bullet { background: #4ade80; border-color: #4ade80; box-shadow: 0 0 8px rgba(74, 222, 128, 0.7); }
      /* Its own line: at the panel's width the rail plus a trailing hint wrapped
       * the hint onto a second row anyway, and half of one. */
      #escHint { flex: 1 0 100%; color: var(--dimmer); letter-spacing: 0.04em; margin-top: 2px; }

      /* The seam between "what the voice is doing" and "what it wants from
       * you". Without it the two halves read as one crowded column. */
      .right {
        position: relative; flex: 1 1 auto; min-width: 0;
        padding: 16px 18px; box-sizing: border-box;
        display: flex; flex-direction: column;
        border-left: 1px solid var(--line);
      }
      /* The tab strip wraps rather than overflowing: at a narrow width four tabs
       * do not fit on one line, and a non-wrapping strip pushed them off the
       * edge of the panel entirely. The right padding is the ×'s parking space. */
      .tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 0 0 auto; margin-bottom: 14px; padding-right: 34px; }
      /* The × is OUT of the wrapping flow. As a flex item it was pushed onto a
       * second line the moment the four tabs filled the first one — a close
       * button floating on its own row under the tabs, which is exactly where a
       * close button should not be. Pinned to the panel's top-right corner it
       * stays put at every width. */
      .right > .closeBtn { position: absolute; top: 14px; right: 16px; z-index: 2; width: 28px; height: 28px; }
      .right > .closeBtn svg { width: 13px; height: 13px; }
      .tab {
        /* 12px of horizontal padding put the four tabs 17px over the width left
         * after the ×'s reserved corner, so "Settings" wrapped to a second row.
         * 9px fits them on one line with room to spare at the panel's design
         * width, and the strip still wraps gracefully below it. */
        display: flex; align-items: center; gap: 5px; padding: 7px 9px; border-radius: 9px;
        border: 1px solid transparent; background: transparent; color: var(--dim); font-size: 11.5px;
        transition: background-color var(--ease), color var(--ease);
      }
      .tab svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.6; }
      .tab:hover { color: var(--text); }
      /* Neutral, not violet. The violet tint read as a coloured status (the
       * same violet the permission cards use for "needs you"), when all it
       * means is "this is the tab you are on". */
      .tab.active { background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.18); color: var(--text); }

      .paneHead { display: flex; align-items: baseline; justify-content: space-between; flex: 0 0 auto; margin-bottom: 10px; }
      .paneTitle { font-size: 10px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; }
      #clearAll { font-size: 11px; color: #8ab4ff; background: none; border: 0; padding: 0; }
      #clearAll:hover { text-decoration: underline; }

      .pane { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      .pane::-webkit-scrollbar { width: 6px; }
      .pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

      .card {
        display: flex; align-items: center; gap: 12px; padding: 11px 12px;
        border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, 0.035);
        flex: 0 0 auto;
      }
      .card .ico { width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto; display: grid; place-items: center; background: rgba(255,255,255,0.06); }
      .card .ico svg { width: 15px; height: 15px; stroke: var(--dim); fill: none; stroke-width: 1.6; }
      .card .body { flex: 1 1 auto; min-width: 0; }
      .card .name { font-size: 12.5px; font-weight: 500; }
      .card .detail { font-size: 11px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
      .card.top { border-color: rgba(139, 124, 246, 0.45); background: rgba(139, 124, 246, 0.08); }
      .acts { display: flex; gap: 7px; flex: 0 0 auto; }
      .btn { padding: 7px 15px; border-radius: 9px; font-size: 11.5px; border: 1px solid var(--line); background: transparent; color: var(--text); transition: background-color var(--ease), border-color var(--ease); }
      .btn:hover { border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.05); }
      .btn.primary { border-color: transparent; background: linear-gradient(135deg, #4c8dff, var(--violet)); color: #fff; font-weight: 500; }
      .btn.primary:hover { filter: brightness(1.12); }

      .empty { font-size: 11.5px; color: var(--dimmer); padding: 14px 2px; }
      .foot { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; padding-top: 11px; margin-top: 4px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--dimmer); }
      .foot svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.6; flex: 0 0 auto; }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="glass">
        <!-- ----------------------------------------------------- collapsed -->
        <div id="collapsed">
          <div class="orb"><div class="ring"></div><div class="dot"></div></div>
          <div class="pillText">
            <div id="pillState">Listening…</div>
            <div id="pillHint">Say “stop listening” or press Esc</div>
          </div>
          <canvas id="pillWave"></canvas>
          <div class="pillActions">
            <button class="shield" id="shieldBtn" type="button" tabindex="-1" title="Permissions">
              <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.4-3 8.2-7 9-4-.8-7-4.6-7-9V6l7-3z"/></svg>
              <span class="badge" id="badge">0</span>
            </button>
            <button class="closeBtn" id="closeBtn" type="button" tabindex="-1" title="Turn voice off (Esc ends the conversation but keeps the wake word)">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>

        <!-- ------------------------------------------------------ expanded -->
        <div id="expanded">
          <div class="left">
            <div class="bigOrb"><div class="arc"></div><div class="core"></div></div>
            <div id="bigState">Listening…</div>
            <canvas id="bigWave"></canvas>
            <div id="transcript"></div>
            <div id="response"></div>
            <div class="spacer"></div>
            <div class="steps">
              <span class="step" id="stepListening"><span class="bullet"></span>LISTENING</span>
              <span class="step" id="stepProcessing"><span class="bullet"></span>PROCESSING</span>
              <span class="step" id="stepReady"><span class="bullet"></span>READY</span>
              <span id="escHint">Press Esc to end chat · × turns voice off</span>
            </div>
          </div>

          <div class="right">
            <button class="closeBtn" id="closeBtn2" type="button" tabindex="-1" title="Turn voice off (Esc ends the conversation but keeps the wake word)">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <div class="tabs">
              <button class="tab active" data-tab="permissions" type="button" tabindex="-1">
                <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.4-3 8.2-7 9-4-.8-7-4.6-7-9V6l7-3z"/></svg>Permissions
              </button>
              <button class="tab" data-tab="memory" type="button" tabindex="-1">
                <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>Memory
              </button>
              <button class="tab" data-tab="tools" type="button" tabindex="-1">
                <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 015.4 5.4l-8.4 8.4-5.4-5.4 8.4-8.4z"/><path d="M4 20l3-1"/></svg>Tools
              </button>
              <button class="tab" data-tab="settings" type="button" tabindex="-1">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 00-1.7-1L14.5 3h-4l-.4 2.6a7 7 0 00-1.7 1l-2.3-1-2 3.4L6 11a7 7 0 000 2l-2 1.5 2 3.4 2.3-1a7 7 0 001.7 1l.4 2.6h4l.4-2.6a7 7 0 001.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/></svg>Settings
              </button>
            </div>

            <div class="paneHead">
              <span class="paneTitle" id="paneTitle">Pending requests (0)</span>
              <button id="clearAll" type="button" tabindex="-1">Clear all</button>
            </div>
            <div class="pane" id="pane"></div>
            <div class="foot">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
              <span>Gnosis will always ask before taking actions that affect your system.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      // ---------------------------------------------------------- waveform
      // Driven by the REAL microphone level, pushed from the main process (the
      // overlay does not own the microphone). The samples arrive ~5x a second,
      // far too sparse to draw directly, so each seeds a rolling history the
      // line eases toward — that is what makes it read as continuous motion
      // rather than a value stepping five times a second.
      //
      // Drawn as a filled liquid body, not discrete bars: a smooth curve through
      // the history samples (quadratic bezier through midpoints, not straight
      // segments — straight segments through sparse points still reads as a bar
      // chart with the corners sanded off) mirrored top and bottom, so speech
      // reads as the glass swelling rather than a meter ticking.
      const BARS = 56;
      const history = new Array(BARS).fill(0);
      let target = 0;
      let current = 0;

      /*
       * Match the canvas backing store to the size it is actually displayed at.
       *
       * Both canvases used to carry hard-coded width/height attributes (440x26
       * and 520x26) while their CSS width was `flex: 1 1 auto` / `100%`. The
       * backing store is what you draw into; the CSS box is what it is scaled to
       * on screen. Whenever those two disagree the browser stretches the result,
       * so the waveform was drawn at one aspect ratio and squashed into another
       * — the visible half of VOICE-UI-ISSUES.md #3, and it got worse the
       * further the window was from the one size the numbers were written for.
       *
       * devicePixelRatio is folded in for the same reason: on a scaled display a
       * 1:1 backing store is upscaled by the compositor and the 1px rim light
       * turns to mush.
       */
      function fitCanvas(cv) {
        if (!cv) return false;
        const dpr = Math.min(window.devicePixelRatio || 1, 2); // 2x is plenty; 3x is just heat
        const w = Math.round(cv.clientWidth * dpr);
        const h = Math.round(cv.clientHeight * dpr);
        if (!w || !h) return false;
        if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
        return true;
      }

      /*
       * A bar meter, not a liquid blob.
       *
       * The previous waveform was one filled curve with a rim light and a
       * specular highlight riding the peak — a lot of compositing for a shape
       * that, at 26px tall, mostly read as a grey smear. Discrete bars mirrored
       * about the centre line say the same thing in far fewer pixels: you can
       * see individual syllables in it, which is the entire point of showing a
       * level at all.
       *
       * Bars are drawn from the centre outwards in both directions so the
       * meter stays visually anchored to its middle no matter how loud it gets,
       * and quiet frames collapse to a dotted line rather than to nothing —
       * an empty canvas looks like a dead microphone.
       */
      function drawInto(cv) {
        if (!fitCanvas(cv)) return;
        const g = cv.getContext("2d");
        const w = cv.width, h = cv.height, mid = h / 2;
        g.clearRect(0, 0, w, h);

        // Widths are in backing-store pixels, so they scale with the device
        // ratio — a 2px bar on a 2.5x display is otherwise a hairline.
        const s = w / Math.max(1, cv.clientWidth);
        const step = w / BARS;
        const barW = Math.max(1.5 * s, step * 0.42);
        const maxAmp = h / 2 - 1.5 * s;

        g.lineCap = "round";
        g.lineWidth = barW;
        for (let i = 0; i < BARS; i++) {
          const v = Math.min(1, history[i] * 7); // speech RMS sits well under 0.2
          // The floor is half a bar width, which renders as a dot: the meter
          // reads as idle rather than broken when nobody is speaking.
          const amp = Math.max(barW / 2, v * maxAmp);
          const x = step * (i + 0.5);

          // Brighter with amplitude. A flat colour made loud and quiet look the
          // same shape at different heights; this makes the loud part read as
          // the loud part even in peripheral vision.
          const a = 0.34 + 0.56 * v;
          g.strokeStyle = `rgba(226, 240, 255, ${a.toFixed(3)})`;
          g.beginPath();
          g.moveTo(x, mid - amp);
          g.lineTo(x, mid + amp);
          g.stroke();
        }
      }

      function tick() {
        current += (target - current) * 0.18;
        history.push(current);
        history.shift();
        drawInto(document.body.classList.contains("expanded") ? $("bigWave") : $("pillWave"));
        requestAnimationFrame(tick);
      }
      tick();

      // A resize has to re-fit the canvases before the next frame draws into
      // them. The rAF loop calls fitCanvas() anyway, so this exists for the one
      // case the loop cannot see: the collapsed↔expanded swap changes which
      // canvas is visible AND the window size at the same moment.
      /*
       * "Voice off in 12s" — the session's own idle timer, shown rather than
       * left to surprise people.
       *
       * The main process sends a deadline once when it arms the timer; this
       * counts it down locally. One message per arm instead of sixty, and the
       * number keeps moving even while the main process is busy inside a turn,
       * which is exactly when a frozen countdown would look like a hang.
       */
      let idleAt = 0;
      let baseHint = "";
      function renderHint() {
        const el = $("pillHint");
        if (!el) return;
        const left = idleAt ? Math.ceil((idleAt - Date.now()) / 1000) : 0;
        // Below zero the session is already closing; showing "0s" for the last
        // tick reads as stuck, and a negative number reads as broken.
        el.textContent = left > 0 ? `${baseHint} · Voice off in ${left}s` : baseHint;
      }
      setInterval(renderHint, 1000);

      const refit = () => { fitCanvas($("pillWave")); fitCanvas($("bigWave")); };
      window.addEventListener("resize", refit);

      // ------------------------------------------------------------- state
      let expanded = false;
      let pending = [];
      let activeTab = "permissions";

      const LABEL = { listening: "Listening…", thinking: "Processing…", speaking: "Answering…", error: "Voice error" };
      const STEP = { listening: "stepListening", thinking: "stepProcessing", speaking: "stepReady", error: null };

      function setExpanded(on) {
        if (expanded === on) return;
        expanded = on;
        document.body.classList.toggle("expanded", on);
        window.voice.resize(on ? "expanded" : "collapsed");
      }

      $("shieldBtn").addEventListener("click", () => setExpanded(!expanded));
      $("collapsed").addEventListener("click", (e) => {
        if (e.target.closest("#shieldBtn") || e.target.closest(".closeBtn")) return;
        setExpanded(true);
      });

      // The × turns voice OFF — detector down, microphone released, setting
      // persisted. It used only to end the conversation, which left the app
      // listening for "hey jarvis" behind a panel the user had just dismissed
      // (VOICE-UI-ISSUES.md #5). Closing the thing that represents a feature
      // has to turn the feature off.
      for (const b of document.querySelectorAll(".closeBtn")) {
        b.addEventListener("click", (e) => {
          e.stopPropagation();
          window.voice.stopVoice();
        });
      }

      // Esc is the lighter exit: it ends this conversation and leaves the wake
      // word armed, so the next "hey jarvis" opens a new one. Two different
      // actions, and the hints below name which is which.
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") window.voice.endSession();
      });

      window.voice.onState((s) => {
        if (s.state) {
          $("pillState").textContent = LABEL[s.state] ?? s.state;
          $("bigState").textContent = LABEL[s.state] ?? s.state;
          for (const id of ["stepListening", "stepProcessing", "stepReady"]) $(id).classList.remove("on");
          const step = STEP[s.state];
          if (step) $(step).classList.add("on");
        }
        if (s.transcript !== undefined) $("transcript").textContent = s.transcript ?? "";
        if (s.response !== undefined) $("response").textContent = s.response ?? "";
        if (s.hint !== undefined) { baseHint = s.hint ?? ""; renderHint(); }
      });

      window.voice.onLevel((v) => { target = Number(v) || 0; });
      window.voice.onIdle?.((m) => { idleAt = Number(m?.at) || 0; renderHint(); });

      // ------------------------------------------------------- permissions
      const ICONS = {
        bash: '<svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg>',
        http: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>',
        diff: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5z"/><path d="M14 3v5h5"/></svg>',
      };

      function render() {
        $("badge").textContent = String(pending.length);
        document.body.classList.toggle("haspending", pending.length > 0);
        $("paneTitle").textContent =
          activeTab === "permissions" ? `Pending requests (${pending.length})` : activeTab;
        $("clearAll").style.display = activeTab === "permissions" && pending.length ? "" : "none";

        const pane = $("pane");
        pane.innerHTML = "";
        if (activeTab !== "permissions") {
          const d = document.createElement("div");
          d.className = "empty";
          d.textContent =
            activeTab === "memory" ? "Session memory lives in the main window — this tab is a placeholder."
            : activeTab === "tools" ? "Tool activity lives in the main window — this tab is a placeholder."
            : "Voice settings live in the settings window (tray → Settings).";
          pane.appendChild(d);
          return;
        }
        if (!pending.length) {
          const d = document.createElement("div");
          d.className = "empty";
          d.textContent = "Nothing waiting on you.";
          pane.appendChild(d);
          return;
        }
        pending.forEach((p, i) => {
          const card = document.createElement("div");
          card.className = "card" + (i === 0 ? " top" : "");
          const ico = document.createElement("div");
          ico.className = "ico";
          ico.innerHTML = ICONS[p.kind] ?? ICONS.diff;
          const body = document.createElement("div");
          body.className = "body";
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = p.name;
          const detail = document.createElement("div");
          detail.className = "detail";
          detail.textContent = p.detail;
          detail.title = p.detail;
          body.append(name, detail);
          const acts = document.createElement("div");
          acts.className = "acts";
          const deny = document.createElement("button");
          deny.className = "btn";
          deny.type = "button";
          deny.tabIndex = -1;
          deny.textContent = "Deny";
          deny.addEventListener("click", () => window.voice.answerPermission(p.id, "no"));
          const allow = document.createElement("button");
          allow.className = "btn primary";
          allow.type = "button";
          allow.tabIndex = -1;
          allow.textContent = "Allow";
          allow.addEventListener("click", () => window.voice.answerPermission(p.id, "yes"));
          acts.append(deny, allow);
          card.append(ico, body, acts);
          pane.appendChild(card);
        });
      }

      window.voice.onPermissions((list) => {
        const had = pending.length;
        pending = Array.isArray(list) ? list : [];
        // A request that nobody can see is a session that has silently stopped.
        if (pending.length > had) setExpanded(true);
        render();
      });

      $("clearAll").addEventListener("click", () => {
        for (const p of [...pending]) window.voice.answerPermission(p.id, "no");
      });

      for (const t of document.querySelectorAll(".tab")) {
        t.addEventListener("click", () => {
          activeTab = t.dataset.tab;
          for (const o of document.querySelectorAll(".tab")) o.classList.toggle("active", o === t);
          render();
        });
      }

      render();
      // Nothing is focused on purpose: a focused button in an always-on-top panel
      // takes keystrokes meant for the app underneath, and can be activated by a
      // stray Enter or Space the user meant for whatever they were working in.
      if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    </script>
  </body>
</html>
