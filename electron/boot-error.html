<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Gnosis — setup needed</title>
    <style>
      :root { --bg: #0d0d12; --panel: #14141c; --border: #262633; --text: #c9d1d9; --dim: #6b7280; --cyan: #22d3ee; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--text);
        font: 13px/1.6 ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas, monospace;
        display: flex; align-items: center; justify-content: center; padding: 32px;
      }
      main { max-width: 640px; }
      h1 { font-size: 15px; font-weight: 700; color: var(--cyan); margin: 0 0 16px; letter-spacing: 0.08em; text-transform: uppercase; }
      pre {
        background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
        padding: 16px; white-space: pre-wrap; word-break: break-word; margin: 0 0 16px;
      }
      p { color: var(--dim); margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Gnosis could not start</h1>
      <pre id="message"></pre>
      <p>The settings window is open behind this one — add your key there, then restart.</p>
    </main>
    <script>
      // The message comes from our own main process (boot()'s error text), not
      // from the network. textContent, never innerHTML.
      const m = new URLSearchParams(location.search).get("message");
      document.getElementById("message").textContent = m || "Unknown startup error.";
    </script>
  </body>
</html>
