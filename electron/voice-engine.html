<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gnosis voice engine</title>
  </head>
  <body>
    <script>
      // The microphone lives here, in a hidden renderer, because getUserMedia
      // needs a DOM and the main process does not have one. Nothing is shown;
      // the visible part is voice-overlay.html.
      //
      // Two jobs:
      //   1. stream 16 kHz PCM to the main process, which feeds openWakeWord
      //      (a local, key-free detector running as a Python child process)
      //   2. utterance capture — record until 1.5s of silence, emit WAV
      //
      // Silence detection is a plain RMS gate rather than a real VAD. That is
      // enough for "stop when they stop talking" in a quiet room, and it costs
      // no model and no network.

      const SILENCE_MS = 1500;
      const SILENCE_RMS = 0.012; // below this counts as room tone
      const MAX_UTTERANCE_MS = 20000; // never record forever

      let stream = null;
      let ctx = null;
      let analyser = null;
      let streamNode = null;   // continuous tap feeding the wake-word detector
      let recording = false;   // suspends the tap while an utterance is captured
      let muted = false;       // true while our own TTS is playing (echo suppression)
      let recordAbort = false; // set when a mute arrives mid-recording: drop the capture

      async function mic() {
        if (stream) return stream;
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
        ctx = new AudioContext({ sampleRate: 16000 });
        const src = ctx.createMediaStreamSource(stream);
        analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        src.connect(analyser);
        return stream;
      }

      function rms() {
        if (!analyser) return 0;
        const buf = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buf);
        let sum = 0;
        for (const v of buf) sum += v * v;
        return Math.sqrt(sum / buf.length);
      }

      /** Encode Float32 mono PCM as a 16-bit WAV — what Whisper wants. */
      function toWav(samples, sampleRate) {
        const buf = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buf);
        const str = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
        str(0, "RIFF");
        view.setUint32(4, 36 + samples.length * 2, true);
        str(8, "WAVE");
        str(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        str(36, "data");
        view.setUint32(40, samples.length * 2, true);
        let o = 44;
        for (const s of samples) {
          const c = Math.max(-1, Math.min(1, s));
          view.setInt16(o, c < 0 ? c * 0x8000 : c * 0x7fff, true);
          o += 2;
        }
        let bin = "";
        const bytes = new Uint8Array(buf);
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }

      async function record() {
        await mic();
        // Muted between the request and here (mic() awaits): do not start.
        if (muted) return;
        recording = true;
        recordAbort = false;
        const chunks = [];
        const proc = ctx.createScriptProcessor(4096, 1, 1);
        const src = ctx.createMediaStreamSource(stream);
        src.connect(proc);
        // Sink to a muted gain node: ScriptProcessor only runs when connected to
        // the destination, but we must not play the microphone back.
        const mute = ctx.createGain();
        mute.gain.value = 0;
        proc.connect(mute);
        mute.connect(ctx.destination);

        const started = Date.now();
        let lastVoice = Date.now();
        let heardAnything = false;

        await new Promise((done) => {
          proc.onaudioprocess = (e) => {
            const input = e.inputBuffer.getChannelData(0);
            chunks.push(new Float32Array(input));
            const level = rms();
            if (level > SILENCE_RMS) { lastVoice = Date.now(); heardAnything = true; }
            const quietFor = Date.now() - lastVoice;
            // recordAbort is the other half of the echo fix. Muting the TAP stops
            // the wake-word detector hearing our own speech, but a recording that
            // was ALREADY RUNNING has its own node on the same stream and kept
            // capturing — so the reply went straight into the next transcription.
            // Gating the start was not enough; this stops one in flight.
            if (recordAbort || (heardAnything && quietFor > SILENCE_MS) || Date.now() - started > MAX_UTTERANCE_MS) {
              proc.onaudioprocess = null;
              done();
            }
          };
        });

        try { proc.disconnect(); src.disconnect(); mute.disconnect(); } catch {}

        recording = false;
        if (recordAbort) { recordAbort = false; return; } // discarded: we were talking
        if (!heardAnything) { window.voice.cancel(); return; }
        const total = chunks.reduce((n, c) => n + c.length, 0);
        const flat = new Float32Array(total);
        let o = 0;
        for (const c of chunks) { flat.set(c, o); o += c.length; }
        window.voice.utterance(toWav(flat, ctx.sampleRate));
      }

      // Playing back synthesised speech: the main process has no audio output,
      // so it hands this renderer a file path.
      //
      // The `ended` report matters as much as the playback. speak() used to be
      // treated as finished the moment the file was handed over, so the session
      // reopened the microphone while the reply was still coming out of the
      // speakers — it transcribed its own voice and answered itself. Whoever is
      // waiting needs to hear about the END, and about failures too, or a clip
      // that never plays leaves the session waiting forever.
      let playing = null;
      window.voice.onPlay(({ file, id }) => {
        try {
          stopAudio();
          const a = new Audio("file:///" + String(file).replace(/\\/g, "/"));
          playing = a;
          // The id travels with the clip so the main process can match the report
          // to the exact clip it is waiting on. A single shared callback let a
          // stale `ended` resolve the CURRENT wait — the session stopped waiting
          // while audio was still playing, and the queue behind it stalled.
          const done = (why) => {
            if (playing !== a) return; // superseded by a newer clip
            playing = null;
            window.voice.playDone(id, why);
          };
          a.addEventListener("ended", () => done("ended"));
          a.addEventListener("error", () => done("error"));
          a.play().catch((e) => {
            window.voice.engineStatus({ reason: "playback failed: " + e.message });
            done("play-rejected");
          });
        } catch (e) {
          window.voice.engineStatus({ reason: "playback failed: " + String(e?.message ?? e) });
          window.voice.playDone(id, "threw");
        }
      });

      /** Cut the current clip off wherever it is. */
      function stopAudio() {
        const a = playing;
        playing = null; // before pause(), so the `ended` handler stays quiet
        if (!a) return;
        try { a.pause(); a.currentTime = 0; a.src = ""; } catch {}
      }
      // Closing the overlay must silence it immediately, mid-word if that is
      // where it is — a panel that keeps talking after you close it is the most
      // obviously broken thing a voice feature can do.
      window.voice.onStopAudio(() => stopAudio());

      // While we are talking, the microphone is deaf. This is the echo fix: with
      // the tap live during playback the detector hears the reply (and can
      // re-trigger on it), and the recorder captures it as if it were the user.
      window.voice.onMute((on) => {
        muted = on;
        let abortedRecording = false;
        if (on) {
          window.voice.level(0); // park the meter rather than freezing it
          if (recording) { recordAbort = true; abortedRecording = true; }
        }
        // Confirm it back. The main process previously only knew it had SENT a
        // mute, which is not the same as the microphone being deaf — and the gap
        // between those two claims is where the echo lived.
        window.voice.muteAck({ on, abortedRecording });
      });

      window.voice.onRecord(() => {
        // A record request that arrives while we are still speaking is the echo
        // bug in its other form. Ignore it; the main process re-arms once
        // playback has genuinely finished.
        if (muted) return;
        record().catch((e) => window.voice.engineStatus({ reason: String(e.message) }));
      });

      window.voice.onConfigure(async (cfg) => {
        if (!cfg?.streamToDetector) {
          window.voice.engineStatus({ wakeWord: false, reason: "wake-word detector unavailable" });
          return;
        }
        try {
          await mic();
          // A continuous tap on the microphone, downsampled to the 16 kHz
          // signed-16-bit mono that openWakeWord requires, handed to the main
          // process a chunk at a time. The detector lives there because it is a
          // Python process, and a renderer cannot own one.
          const tap = ctx.createScriptProcessor(4096, 1, 1);
          const src = ctx.createMediaStreamSource(stream);
          src.connect(tap);
          const mute = ctx.createGain();
          mute.gain.value = 0;
          tap.connect(mute);
          mute.connect(ctx.destination);
          tap.onaudioprocess = (e) => {
            // While capturing an utterance the recorder owns the microphone;
            // feeding the detector at the same time would let the user's own
            // command re-trigger the wake word. `muted` is the same idea for our
            // OWN speech: the reply coming out of the speakers must not reach the
            // detector either, or the app wakes itself up.
            if (recording || muted) return;
            const input = e.inputBuffer.getChannelData(0);
            const pcm = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
              const c = Math.max(-1, Math.min(1, input[i]));
              pcm[i] = c < 0 ? c * 0x8000 : c * 0x7fff;
            }
            window.voice.audio(pcm.buffer);
          };
          streamNode = { tap, src, mute };
          window.voice.mic({ ok: true, reason: "microphone open, streaming to the detector" });
          window.voice.engineStatus({ wakeWord: true, reason: "microphone open, streaming to the detector" });
          // A level every ~200ms: enough for a meter, far less chatty than a
          // message per audio frame.
          setInterval(() => window.voice.level(muted ? 0 : rms()), 200);
        } catch (e) {
          const why = String(e?.name === "NotAllowedError"
            ? "permission denied — Windows microphone privacy settings, or the app was not granted media access"
            : (e?.message ?? e));
          window.voice.mic({ ok: false, reason: why });
          window.voice.engineStatus({ wakeWord: false, reason: "microphone unavailable: " + why });
        }
      });
    </script>
  </body>
</html>
