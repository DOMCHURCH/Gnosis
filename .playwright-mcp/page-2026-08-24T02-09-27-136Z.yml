                    - generic [ref=f16e1314]: 5 out of 5 stars
                    - link [ref=f16e1317] [cursor=pointer]:
                      - /url: /portal/customer-reviews/srp/-/R15V52MLSOGIFV/ref=cm_cr_dp_d_rvw_ttl?_encoding=UTF8&ie=UTF8
                      - heading "Totally capable and worth the buy" [level=5] [ref=f16e1318]
                    - generic [ref=f16e1319]: Reviewed in the United States on August 6, 2024
                    - link "Verified Purchase" [ref=f16e1323] [cursor=pointer]:
                      - /url: /gp/help/customer/display.html/ref=cm_cr_dp_d_rvw_avp?ie=UTF8&nodeId=G8UYX7LALQC8V9KA
                    - generic [ref=f16e1326]:
                      - generic [ref=f16e1332]:
                        - paragraph [ref=f16e1333]: I recently bought this machine for two purposes. The deal was I'd use this for my freelance work for a month while my 2019 Macbook Pro was being fixed and then my niece gets it for college. So it's really a gift, but I got to use it for a few weeks.
                        - paragraph
                        - paragraph [ref=f16e1334]: My biggest grip is that the ports are all on one side, the side that makes plugging things in on my desk awkward. My Macbook Pro has two ports on each side, and I always end up using the right side ports for charging and for the dongle.
                        - paragraph
                        - paragraph [ref=f16e1335]: But I almost never use it as a LAPtop. It's really a desktop machine that I take from desk to desk with rare appearances not plugged into an external monitor and other devices. It is more portable than my Pro but not enough for it to make a big difference. On a small popup desk in a university auditorium and bouncing around campus, this is probably more noticeable, I just don't have the experience to comment.
                        - paragraph
                        - paragraph [ref=f16e1336]: I only use one external monitor but for power users using two monitors the new M3 chip probably makes a big difference. I don't even know if my 2019 Pro with an Intel chip can do this, I've never tried. But I think power users requiring multiple monitors are aiming for the Pro.
                        - paragraph
                        - paragraph [ref=f16e1337]: Running high-ish intensity apps like IntelliJ with multiple apps in the background, I have to concede that this machine is a little slower than my 2019 Pro. But I think that's largely to do with the fact that my main machine has more RAM. With solid state memory being the norm these days it doesn't matter much, and really even high intensity tasks that make my pro's fan start up only take maybe a second or two more on this machine.
                        - paragraph
                        - paragraph [ref=f16e1338]: I'm not an Apple preacher. I still haven't decided whether I like macOS more than Windows. But Apple hardware seems to be better than any PC hardware in this price range. PC laptops seem to degrade faster, mostly the battery. PC laptop batteries go from 18 hours to 2 hours over the course of 5 years. My Pro battery went from 18 or so to 4 over 5 years. And these days you can't change a PC battery with this form factor either.
                        - paragraph
                        - paragraph [ref=f16e1339]: The Pro screen is definitely better, but again I'm using an external monitor 99% of the time, so it doesn't matter much for me.
                        - paragraph
                        - paragraph [ref=f16e1340]: If you're running high intensity apps you should go for the Pro still, but the difference isn't really that huge. If you're doing things that don't involve high intensity calculations this is probably the best machine on the market especially for the money.
                        - paragraph
                        - paragraph [ref=f16e1341]: If you're trying to decide between this and a PC of similar price and reputation, this is probably the first time I'd say Apple is offering a better product for the money. This machine is cheaper than it should be. So it's really a decision between macOS and Windows. Mac has the better command line out of the box but similar Windows tools can be installed just as easily. For gaming, Windows wins, but this isn't a gaming device. The best benefit to macOS for my work is that my employer won't give administrative privs to Windows users, but for macOS they haven't removed that yet, so I can actually do my job without having to ask permission to install an ad blocker in Chrome. Huge plus.
