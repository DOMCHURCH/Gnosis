                    - generic [ref=f16e1486]:
                      - paragraph [ref=f16e1487]: My first ever MacBook. Have always been a windows guy but thought I’d give it a try. Overall it’s been about two months of using and I love it so far. Have had multiple people comment how nice my laptop looks.
                      - paragraph
                      - paragraph [ref=f16e1488]: Been using this for school. Decided to finish my senior year online. Truthfully I was a little worried about the 8gb of RAM as most laptops I’ve had have had 16. That being said, I’ve had no issues with it and it has run multiple tabs and windows well seamlessly flowing between them. Have loved working on this for school. Not much storage on the laptop, but really hadn’t been an issue as I use iCloud and OneDrive for school work.
                      - paragraph
                      - paragraph [ref=f16e1489]: Biggest thing I love is the battery life. It last so long compared to all my other laptops I’ve owned and I don’t feel tethered to my charger at all.
                      - paragraph
                      - paragraph [ref=f16e1490]: Overall, if you’re budget allows, I think this is great laptop for school and work. Wouldn’t recommend for gaming or anything like that, but for just about everything else it seems great. And again, for anyone else wondering like I was , the 8gb model has been more tan enough for my school work so far.
