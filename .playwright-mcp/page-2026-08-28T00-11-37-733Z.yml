                  - text: "± Service coverage is available only for covered devices and their original included accessories for protection against (i) defects in materials or workmanship, (ii) batteries that retain less than 80% of their original capacity, and (iii) unlimited incidents of accidental damage. Accidental Damage means physical damage from handling due to unexpected and unintentional events. If an iPad is covered in your plan, one compatible Apple Pencil and one compatible Apple-branded iPad keyboard used with your iPad are also covered. AppleCare One is subject to eligibility rules; additions to plan may require inspection and a diagnostic check: Devices must be less than 4 years old and headphones must be less than 1 year old, and only devices in your Apple Account can be covered under AppleCare One. Limit of one (1) Apple Vision Pro can be covered under AppleCare One at a time. Replacement equipment that Apple provides as part of the repair or replacement service may contain new or previously used genuine Apple parts that have been tested and pass Apple functional requirements. There are no service fees for mechanical failures. Each incident of accidental damage protection is subject to a service fee plus applicable tax. If you have a plan with theft and loss coverage, each incident of theft or loss is subject to a deductible plus applicable tax. For complete details, see the"
