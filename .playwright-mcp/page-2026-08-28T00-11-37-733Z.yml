              - listitem [ref=e609]:
                - generic [ref=e610]: Footnote
                - generic [ref=e611]:
                  - text: "#"
                  - paragraph [ref=e612]: "Apple Upgrade Lease: This offer is for a consumer lease, not a purchase or loan. Lease provided by Klarna Inc. for 12-, 24-, or 36-month term. 12- and 36-month terms not available for all device models. Your first monthly payment is due approximately 30 days after device is shipped or available for pickup. Lease approval is subject to eligibility and is based on creditworthiness. Monthly payments are based on the selected device and lease term. For example:"
                  - paragraph [ref=e613]: For an iPhone 17 Pro 256GB with a purchase price of $1099 (excluding taxes and any trade-in credit), the typical monthly payment is $31.99 (excluding taxes and any trade-in credit) for a 24-month lease term and $45.99 (excluding taxes and any trade-in credit) for a 12-month lease term.
                  - paragraph [ref=e614]: For an Apple Watch Series 11 42mm with a purchase price of $399 (excluding taxes and any trade-in credit), the typical monthly payment is $11.99 (excluding taxes and any trade-in credit) for a 24-month lease term and $21.99 (excluding taxes and any trade-in credit) for a 12-month lease term.
                  - paragraph [ref=e615]: For an iPad Pro 256GB with a purchase price of $1199 (excluding taxes and any trade-in credit), the typical monthly payment is $24.99 (excluding taxes and any trade-in credit) for a 36-month lease term and $31.99 (excluding taxes and any trade-in credit) for a 24-month lease term.
                  - paragraph [ref=e616]: For a MacBook Pro 16GB with a purchase price of $1999 (excluding taxes and any trade-in credit), the typical monthly payment is $38.99 (excluding taxes and any trade-in credit) for a 36-month lease term and $53.99 (excluding taxes and any trade-in credit) for a 24-month lease term.
                  - paragraph [ref=e617]: No security deposit required. A trade-in device may reduce monthly payments. Advertised monthly payment amount may not include a trade-in device’s estimated value. Upgrades are not guaranteed and are subject to eligibility and approval.
                  - paragraph [ref=e618]: "For iPhone only: In order to lease an iPhone, you must select one of the following carriers (but you cannot use a prepaid carrier plan): AT&T, T-Mobile, or Verizon. A leased iPhone is always unlocked, so you can switch carriers at any time, subject to your carrier's terms."
                  - paragraph [ref=e619]: "Terminating your Apple Upgrade Lease: Closing your lease and returning your device terminates your lease. You may incur substantial fees if you terminate your lease before the end of your initial lease term. You may have the option to upgrade to a new device by entering into a new lease agreement and returning your prior device. If you upgrade, your new monthly payments may be greater than your prior monthly payments. If you do not upgrade, terminate your lease, or purchase your device by the end of the initial lease term, the lease will convert to a month-to-month lease for up to six months. Your monthly payments may increase during the month-to-month periods. If you take no action at the end of your extension period, you will be charged the purchase fee under your lease. You will not own your device at the end of your lease, unless you pay the purchase fee. Insurance is not included in your lease, and you may incur damage fees if the device is lost, stolen, or not returned in the condition required by the lease."
                  - paragraph [ref=e620]: "Apple Upgrade Lease Eligibility: Leases are only available to U.S. residents (excluding residents of U.S. territories). Leased devices are only available for shipping to U.S. addresses (excluding U.S. territories) or pick up at Apple Retail stores in the U.S. (excluding U.S. territories). To be eligible for a lease, you must be at least 18 years old (or the legal age in your state of residence), have a valid Social Security number or individual taxpayer identification number (ITIN), have an accepted credit or debit card, have an Apple Account in good standing, have a Klarna Account, and be able to receive security verification codes via text message. Leases are not available on refurbished accessories or online at the following special stores: Apple Employee Purchase Plan; participating corporate Employee Purchase Programs; Apple at Work for small businesses or enterprises; Government, Education, or Veterans and Military Purchase Programs."
            - paragraph
            - paragraph [ref=e621]: 1GB = 1 billion bytes and 1TB = 1 trillion bytes; actual formatted capacity less.
            - paragraph
            - paragraph [ref=e622]: Display and accessories sold separately.
