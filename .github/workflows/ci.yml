name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: build & verify
    # Windows-first: dom's path handling, the PTY layer (node-pty/ConPTY) and
    # several verify suites are Windows-specific, so this is the platform that
    # actually needs to stay green.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The verify suites import from dist/, so the build has to land first.
      - run: npm run build

      # The browser UI is checked by its OWN tsconfig: the root one is rootDir
      # "src" and never saw web/src, which is how a call to a function that did
      # not exist reached a phone. Named as a separate step so a UI type error
      # reads as one rather than as a build failure.
      - name: typecheck web UI
        run: npm run typecheck:web

      - run: npm run verify
