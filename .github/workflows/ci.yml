name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: build & verify
    # Windows-first: dom's path handling, the PTY layer (node-pty/ConPTY) and
    # several verify suites are Windows-specific, so this is the platform that
    # actually needs to stay green.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The verify suites import from dist/, so the build has to land first.
      - run: npm run build

      # playwright arrives TRANSITIVELY (via @playwright/mcp), so it always
      # resolves and s90-voice-overlay.mjs never takes its "not installed"
      # skip — it goes straight to chromium.launch() and dies with
      # "AttachConsole failed" on a runner that has no browser binaries. The
      # import resolving is not the same question as the browser existing, so
      # the browser has to be fetched explicitly.
      - name: install Playwright's Chromium (needed by the overlay suite)
        run: npx playwright install chromium

      # The browser UI is checked by its OWN tsconfig: the root one is rootDir
      # "src" and never saw web/src, which is how a call to a function that did
      # not exist reached a phone. Named as a separate step so a UI type error
      # reads as one rather than as a build failure.
      - name: typecheck web UI
        run: npm run typecheck:web

      # The browser's event types are generated from src/events.ts. If the
      # checkout's copy differs from what the generator produces, someone edited
      # the generated file or forgot to rebuild — fail rather than ship a wire
      # format that disagrees with itself.
      - name: event types are in sync with the server
        run: |
          npm run gen:events
          git diff --exit-code web/src/events.generated.ts

      - run: npm run verify
